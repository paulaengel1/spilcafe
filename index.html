<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Ida Marie, Bex, Marie Luise & Sofie" />
    <meta name="description" content="Project Template" />
    <link rel="stylesheet" href="app.css" />
    <link rel="icon" href="img/favicon.ico" />

    <title>Spiloversigt</title>
  </head>

  <body>
    <header>
      <h1>Spiloversigt</h1>
    </header>

    <main>
      <!-- Search Bar -->
      <div class="searchbar-container">
        <label for="search-input">Søg efter spil</label>
        <input
          id="search-input"
          type="search"
          placeholder="Søg spil..."
        />
      </div>
      <!-- Filter Bar -->
      <section class="filterbar">
        <label for="players-select">Antal spillere</label>
        <select id="players-select"></select>
        
        <label for="genre-select2">Varighed</label>
        <select id="genre-select2"></select>
        
        <label for="genre-select1">Kategori</label>
        <select id="genre-select1"></select>

        <button id="clear-filters" class="clear-btn">
          <span class="btn-icon"></span>
          <span class="btn-text">Ryd filtre</span>
        </button>
      </section>
      <!-- Game List -->
      <section aria-labelledby="games-heading">
        <h2 id="games-heading">Alle spil</h2>
      
        <div id="game-list">
          <!-- Game cards will be rendered here by JavaScript -->
        </div>
      </section>
    </main>

    <dialog id="game-dialog" aria-labelledby="dialog-title">
      <div id="dialog-content"></div>
    
      <button
        id="close-dialog"
        type="button"
        autofocus
        onclick="document.getElementById('game-dialog').close()"
      >
        Luk
      </button>
    </dialog>
    <script src="app.js"></script>
  </body>
</html>
